# Guard the things that have silently broken before.
#
# Every check here exists because the failure it catches actually reached the
# outside world at least once:
#
#   * the unit suite pins the filter banks numerically, so no result can drift
#     with a library version;
#   * check_submission.py was written to stop a submission going out without a
#     compiled PDF, then sat unused and a fourth submission went out without
#     one -- a checker nobody runs is not a checker;
#   * sync_public_numbers.py compares the README and the project page against
#     the paper's generated macros, after both spent months advertising
#     sign-law figures the paper had retracted.
#
# Deliberately NOT here: anything that needs the run records or a GPU. These
# checks run on a clean clone in under a minute, which is what makes them get
# run at all.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn torchmetrics timm pyyaml pandas pytest
      - name: Unit suite (includes the pinned filter-bank fingerprints)
        run: python -m pytest tests/ -q

  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public numbers match the paper
        # Compares every tagged figure in README.md and docs/index.md against
        # paper/tables/numbers.tex. Exits non-zero on a mismatch, so a stale
        # headline cannot be merged.
        run: python scripts/sync_public_numbers.py --check

  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poppler for the page/word counts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Submission package is complete and within the journal's limits
        run: python paper/check_submission.py
