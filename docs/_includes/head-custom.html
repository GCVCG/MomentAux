<!-- Render ```mermaid fences on GitHub Pages (Jekyll turns them into
     div.language-mermaid code blocks; swap each for a live mermaid graph). -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  const hosts = new Set();
  document.querySelectorAll("div.language-mermaid, code.language-mermaid")
    .forEach(el => hosts.add(el.closest("div.language-mermaid") || el.closest("pre")));
  hosts.forEach(host => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = host.textContent;
    host.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: false, theme: "neutral" });
  await mermaid.run();
</script>
