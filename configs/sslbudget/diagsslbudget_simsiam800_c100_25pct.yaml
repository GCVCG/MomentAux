# SSL BUDGET CONTROL, simsiam at 800 pre-epochs (4x the cost-normalised
# budget, ~5x the baseline's total cost). Run across the envelope rather
# than at one or two fractions: every other effect in this study is
# data-regime-dependent, so a budget claim read off two points would be the
# same sparse-grid extrapolation this paper warns about elsewhere.
name: diagsslbudget_simsiam800_c100_25pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 25
stem: none
stem_calibrate: true
init_from: runs/simsiam_pre800_c100_25pct/seed{seed}/pretrain.pt
