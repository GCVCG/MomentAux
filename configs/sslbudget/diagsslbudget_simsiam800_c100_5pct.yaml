# SSL BUDGET CONTROL: SimSiam pre-trained for 800 epochs (4x the
# cost-normalised budget) before the frozen supervised recipe. Tests whether
# 'SimSiam learns almost nothing at this scale' is a statement about the
# METHOD or only about the BUDGET a cost-normalised protocol allows it.
name: diagsslbudget_simsiam800_c100_5pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
init_from: runs/simsiam_pre800_c100_5pct/seed{seed}/pretrain.pt
