# Cityscapes semantic segmentation, the full training set.
#
# THE THIRD DENSE POPULATION: the DOMAIN test rather than the label-space one.
# 19 classes, driving imagery, near-fixed camera geometry and a scene layout
# that barely varies between images -- as far from VOC's object-centric photos
# as a segmentation benchmark gets, while staying a segmentation benchmark.
#
# TWO DEVIATIONS, both stated rather than buried. (1) The official download is
# account-gated, so the images come from an ungated mirror; the preparation
# script verifies the mask encoding against the official 19-class trainId map
# rather than trusting it. (2) Images are stored at HALF resolution
# (512x1024): the frozen 512 crop on a 2048-wide frame would sample a far
# smaller share of the scene than the same crop does on VOC, so half-res keeps
# the recipe comparable across populations. Both applied identically to both
# arms.#
# The dense recipe (SGD 0.01, batch 16, 512 crops with scale 0.5-2.0 and flip,
# 200 epochs, cosine) is FROZEN across every dense cell on every population --
# no per-dataset tuning, exactly as the classification grid is frozen. Both
# arms of this pair are identical except the moment_aux block.
#
# *** SCHEDULE RE-PINNED 50 -> 200 EPOCHS (2026-08-11, user decision).
# The original dense recipe used 50 epochs. The pre-registered L1 control
# measured what that cost: voc@10% baseline 7.23 -> 18.42 mIoU at 200 epochs,
# a +155% rise, so the 50-epoch envelope was measured on segmentors that were
# nowhere near trained and its absolute numbers reported a WEAK RECIPE as much
# as a weak prior. 200 epochs is not a tuned value -- it is the SAME budget the
# frozen classification recipe uses at every fraction, which is what makes a
# cross-task comparison (e.g. dense-vs-classification at matched images per
# class) legitimate rather than confounded by schedule. Choosing the dense
# budget by inspecting convergence curves was explicitly rejected: that would
# tune the recipe to the task, which this study does nowhere else.
# eval_every 5 -> 20 keeps the number of validation passes per run at 10.
# The 50-epoch runs are preserved as the 1x arm of a schedule axis.
name: cityscapes_none_100pct
task: segmentation
dataset: cityscapes
backbone: resnet18
output_stride: 8
epochs: 200
batch_size: 16
lr: 0.01
weight_decay: 0.0001
crop: 512
num_workers: 4
eval_every: 20
pretrained: false
