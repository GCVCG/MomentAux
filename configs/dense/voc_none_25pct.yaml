# PASCAL VOC-2012 semantic segmentation, 25% of the augmented training
# set (2,648 images, ~132 per class over 20 object classes).
#
# WHY DENSE CELLS EXIST: every claim in the study is measured on top-1
# accuracy. The auxiliary target is a DENSE oriented-energy map, so a dense
# task is the natural place to ask whether the fusion rule and the law
# Delta = G + readout are properties of the method or of the metric. State
# the bias with the result: a dense target on a dense task is the most
# favourable venue this prior could be given.
#
# The dense recipe (SGD 0.01, batch 16, 512 crops with scale 0.5-2.0 and
# flip, 200 epochs, cosine) is frozen across every dense cell; both arms of
# this pair are identical except the moment_aux block.
#
# *** SCHEDULE RE-PINNED 50 -> 200 EPOCHS (2026-08-11, user decision).
# The original dense recipe used 50 epochs. The pre-registered L1 control
# measured what that cost: voc@10% baseline 7.23 -> 18.42 mIoU at 200 epochs,
# a +155% rise, so the 50-epoch envelope was measured on segmentors that were
# nowhere near trained and its absolute numbers reported a WEAK RECIPE as much
# as a weak prior. 200 epochs is not a tuned value -- it is the SAME budget the
# frozen classification recipe uses at every fraction, which is what makes a
# cross-task comparison (e.g. dense-vs-classification at matched images per
# class) legitimate rather than confounded by schedule. Choosing the dense
# budget by inspecting convergence curves was explicitly rejected: that would
# tune the recipe to the task, which this study does nowhere else.
# eval_every 5 -> 20 keeps the number of validation passes per run at 10.
# The 50-epoch runs are preserved as the 1x arm of a schedule axis.
name: voc_none_25pct
task: segmentation
dataset: voc_seg
split: train_aug
backbone: resnet18
output_stride: 8
epochs: 200
batch_size: 16
lr: 0.01
weight_decay: 0.0001
crop: 512
num_workers: 4
eval_every: 20
pretrained: false
subset_pct: 25
stem_calibrate: true
