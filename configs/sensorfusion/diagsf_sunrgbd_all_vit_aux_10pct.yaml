# SUN RGB-D sensor fusion on ViT-tiny (64px => patch 8, 8x8 tokens, tap
# blocks.8) -- is the source-level result specific to ResNet-18? AdamW =>
# diagnostic namespace. SENSOR-FUSED: RGB + depth, 4 channels.
name: diagsf_sunrgbd_all_vit_aux_10pct
dataset: sunrgbd_all
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: blocks.8
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
