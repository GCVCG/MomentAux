# So2Sat LCZ42 CROSS-MODALITY fusion. CROSS-MODALITY FUSED: radar and optical together, 18 channels.
# ResNet-18 under the FROZEN recipe (SGD 0.1, cosine, 200 ep, batch 128,
# crop+flip): the only deviation from a headline cell is the input band set,
# so these are directly comparable to each other.
name: sf_so2sat_all_none_5pct
dataset: so2sat_all
backbone: resnet18
optimizer: sgd
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
