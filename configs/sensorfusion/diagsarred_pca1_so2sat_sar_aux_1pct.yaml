# SAR CHANNEL-REDUCTION DIAGNOSTIC (2026-08-23, limitations block G): sf_so2sat_sar_aux_1pct
# VERBATIM with ONLY moment_aux.channel_reduce: pca1 added. Baseline is sf_so2sat_sar_none_1pct.
# diag prefix: a channel-reduction variant, never a headline row. See momentstem/energy.py docstring.
# So2Sat LCZ42 CROSS-MODALITY fusion. SOURCE A: Sentinel-1 SAR, 8 channels (active radar backscatter).
# ResNet-18 under the FROZEN recipe (SGD 0.1, cosine, 200 ep, batch 128,
# crop+flip): the only deviation from a headline cell is the input band set,
# so these are directly comparable to each other.
name: diagsarred_pca1_so2sat_sar_aux_1pct
dataset: so2sat_sar
backbone: resnet18
optimizer: sgd
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
  channel_reduce: pca1
