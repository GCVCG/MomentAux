# Multispectral EuroSAT sensor fusion on ViT-tiny -- is the sensor-level
# stack result specific to ResNet-18? AdamW => diagnostic namespace.
# SENSOR-FUSED: all 13 bands.
name: diagsfvit_eurosatms_all_aux_10pct
dataset: eurosatms_all
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: blocks.8
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
