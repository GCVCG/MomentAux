# Multispectral EuroSAT sensor fusion, scarce end of the envelope.
# ResNet-18 under the FROZEN recipe (SGD 0.1, cosine, 200 ep, batch 128,
# crop+flip): the only deviation from a headline cell is the input band set,
# so these are directly comparable to each other.
name: sf_eurosatms_nir_aux_1pct
dataset: eurosatms_nir
backbone: resnet18
optimizer: sgd
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
