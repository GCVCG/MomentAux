# SUN RGB-D scene classification (19 classes, official split): the
# third multi-source population -- appearance vs geometry. SOURCE B: raw depth (geometry), 1 channel -- toolbox decode, clip 10 m, [0,1], 0 = missing.
# ResNet-18 under the FROZEN recipe (SGD 0.1, cosine, 200 ep, batch 128,
# crop+flip): the only deviation from a headline cell is the input source,
# so these are directly comparable to each other.
name: sf_sunrgbd_depth_none_10pct
dataset: sunrgbd_depth
backbone: resnet18
optimizer: sgd
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
