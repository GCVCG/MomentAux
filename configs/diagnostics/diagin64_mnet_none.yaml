# ImageNet64 scale control, extra backbone family (mobilenetv3_small_100).
# Stage 3: the law's scale test on FOUR backbone families, not two.
# 40-epoch deviation as diagin64_r18/vit; both arms identical. diag-only.
name: diagin64_mnet_none
dataset: imagenet64
backbone: mobilenetv3_small_100
epochs: 40
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 3
small_input: true
pretrained: false
subset_pct: 100
stem: none
stem_calibrate: true
