# PathMNIST 64px (histopathology, 9-way) -- biomedical domain
# Champion recipe VERBATIM (SGD, 200ep, crop+flip, lambda0=1.0 cosine->0,
# magnitude target, tap layer3, MSE) -- domain-generalization campaign
# 2026-07-23. num_workers=2 (tin convention, 64px pipelines).
name: pathmnist_none_10pct
dataset: pathmnist
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
