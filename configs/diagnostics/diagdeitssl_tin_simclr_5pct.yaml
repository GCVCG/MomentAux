# DeiT-aug + SimCLR-init ViT on tin@10% (Track C): does the substitution flip
# transplant off C100? Reuses Track B's pretrain (augmentation-agnostic).
name: diagdeitssl_tin_simclr_5pct
dataset: tin
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
augment: deit
init_from: runs/simclr_pre_vit_tin_5pct/seed{seed}/pretrain.pt
