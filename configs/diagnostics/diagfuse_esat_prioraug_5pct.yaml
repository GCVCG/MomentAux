# diag: recipe deviation (DeiT augmentation and/or an SSL init).
# E2, referee-requested: the three fusion arms missing on the two
# populations that took NO part in configuration selection. Copied
# verbatim from the prior cell, so only the added source changes.
name: diagfuse_esat_prioraug_5pct
dataset: eurosat
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
augment: deit
