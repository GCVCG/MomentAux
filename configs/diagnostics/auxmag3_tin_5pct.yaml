# WIDER-BANK test (2026-07-19): champion aux config verbatim EXCEPT the target
# bank -- energy-magnitude3 = the committed 8-pair bank PLUS one lower octave
# (sigma=4), k=17 so the new envelope fits. Physically meaningful only at
# 64x64, hence tin. Shares baselines with tin_none_5pct. Redundancy account
# predicts NO gain over the champion; see CLAUDE.md prediction.
name: auxmag3_tin_5pct
dataset: tin
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude3
  kernel_size: 17
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
