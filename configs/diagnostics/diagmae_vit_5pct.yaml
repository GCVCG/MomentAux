# MAE-init on ViT-tiny (C100@5%) -- the masked/predictive SSL comparator.
# The study's SSL set (SimCLR, SimSiam, DINO) is invariance-based; masked
# reconstruction may supply a different currency. Same protocol as the
# SimCLR-ViT cells: 200ep pretrain on the SAME committed subset images (2x
# compute), then this cell verbatim from diagvit_none_5pct. AdamW because
# ViTs do not train under the frozen SGD recipe; diag-only, never headline.
name: diagmae_vit_5pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
init_from: runs/mae_pre_vit_5pct/seed{seed}/pretrain.pt
