# Block C, limitations campaign (2026-08-24): auxmag_25pct_sched0 VERBATIM except
# name and moment_aux.stem -> energy-phase. Only the aux TARGET varies.
name: diagtgt2_c100_phase_25pct
dataset: cifar100
