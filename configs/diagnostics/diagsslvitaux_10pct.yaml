# COMBO on ViT: SimCLR init + moment aux. On conv these do NOT stack
# (aux COSTS an SSL-initialized run -1.51). On ViT they tie e2e at 10%
# while aux carries MORE feature gain (G 14.85 vs 13.46) -- do they stack here?
# ViT-tiny from scratch @C100 10% -- first ATTENTION backbone (ConvNeXt was
# the first non-ResNet but is still convolutional). AdamW because ViTs do not
# train under the frozen SGD recipe; diag-only, never a headline row.
name: diagsslvitaux_10pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: blocks.8
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
init_from: runs/simclr_pre_vit_10pct/seed{seed}/pretrain.pt
