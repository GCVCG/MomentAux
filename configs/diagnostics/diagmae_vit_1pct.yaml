# MAE-init on ViT-tiny (C100@1%) -- the low-data end of the masked-SSL
# envelope, which stopped at 5%. This is exactly the band the prior's
# attention claim is about. Contrastive learning starves here for want of
# negatives (SimCLR@1% buys +0.61 over baseline); masked reconstruction draws
# its supervision from PATCHES rather than images, so it may not. Same
# protocol as every other MAE cell: 200ep pretrain on the SAME committed
# subset images (2x compute), then diagvit_none_1pct verbatim from that
# init. AdamW => diag-only, never headline.
name: diagmae_vit_1pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
init_from: runs/mae_pre_vit_1pct/seed{seed}/pretrain.pt
