# SSL data-dimension point: 10% C100, abl10_none verbatim + SimCLR
# init on the SAME committed 10% subset images. Tests whether SSL's
# 2x-compute win at 5% (+3.9 over champion) holds as data shrinks, or
# collapses when there are too few images to contrast (aux prediction:
# aux keeps its +1.5..+6 while SimCLR starves).
name: diagssl_simclr_10pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 8
small_input: true
pretrained: false
stem_kernel_size: 11
subset_pct: 10
stem: none
init_from: runs/simclr_pre_10pct/seed{seed}/pretrain.pt
