# ViT-tiny from scratch @C100 1% -- first ATTENTION backbone (ConvNeXt was
# the first non-ResNet but is still convolutional). AdamW because ViTs do not
# train under the frozen SGD recipe; diag-only, never a headline row.
name: diagvit_aux_1pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: blocks.8
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
