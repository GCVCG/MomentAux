# Block A of the limitations campaign (CLAUDE.md "### A. THE EXCEPTION CLUSTER",
# 2026-08-23): parent grid_food_r18_axmagnitudeL3_l10to00_hn_8bd74b_10pct VERBATIM + save_every: 20 so the run
# leaves ckpt_ep020..ep200 for trajectory probes. Diagnostic; parent finals untouched.
# Food-101 (squash-64, 101-way) -- fine-grained food
# Champion recipe VERBATIM -- domain-generalization grid (2026-07-23,
# user: "the new databases need to be benchmarked similarly to the other
# configurations"). num_workers=2 (64px convention).
name: diagtraj_grid_food_r18_axmagnitudeL3_l10to00_hn_8bd74b_10pct
dataset: food101
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
save_every: 20
