# WIDTH-MATCHED control for auxmag3 (2026-07-20): 12 target channels from 6
# orientations x the committed 2 octaves (k11) -- no new frequency content.
# Separates "new octave" from "wider target". Shares tin_none_5pct.
name: auxmag6o_tin_5pct
dataset: tin
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude6o
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
