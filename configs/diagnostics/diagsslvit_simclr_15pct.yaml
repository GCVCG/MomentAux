# ViT-tiny from scratch @C100 10% -- first ATTENTION backbone (ConvNeXt was
# the first non-ResNet but is still convolutional). AdamW because ViTs do not
# train under the frozen SGD recipe; diag-only, never a headline row.
name: diagsslvit_simclr_15pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 15
stem: none
stem_calibrate: true
init_from: runs/simclr_pre_vit_15pct/seed{seed}/pretrain.pt
