# ImageNet-1k @64px (1.28M imgs, 1000 classes) -- the SCALE control.
# Same 64px pipeline as tin; ONLY scale changes (13x images, 5x classes).
# DEVIATION: 40 epochs, not the frozen 200 (200 epochs on 1.28M images is
# ~90h/seed). Both arms get the identical budget so Delta stays valid.
# 40 ep is the standard ImageNet64 budget (Chrabaszcz et al. 2017).
# diag-only: NEVER mixed into frozen-recipe headline tables.
name: diagin64_vit_none
dataset: imagenet64
backbone: vit_tiny
optimizer: adamw
epochs: 40
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 3
small_input: true
pretrained: false
subset_pct: 100
stem: none
stem_calibrate: true
