# PROSPECTIVE combination (wave 1): the committed call for this pair
# was recorded in CLAUDE.md BEFORE this cell existed. Parent single-
# arm config + the reference-configuration aux block, nothing else.
name: diagprosp_simclraux_c100_25pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 25
stem: none
stem_calibrate: true
init_from: runs/simclr_pre_c100_25pct/seed{seed}/pretrain.pt
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
