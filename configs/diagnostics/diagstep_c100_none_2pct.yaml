# diag: epochs deviate from the frozen 200 by design.
# B4, referee-requested: hold TOTAL OPTIMIZER STEPS fixed (~600)
# across data fractions, so the envelope shape is a data effect
# and not a step-budget effect. Both arms get the same budget.
name: diagstep_c100_none_2pct
dataset: cifar100
backbone: resnet18
epochs: 86
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 2
stem: none
