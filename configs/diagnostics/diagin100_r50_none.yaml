# ImageNet-100 @224px NATIVE resolution -- the RESOLUTION + MODEL-SCALE
# control. Everything else in the study is 32-96px with <=28M params;
# this is resnet50 at the standard 224 pipeline (RandomResizedCrop).
# DEVIATION: 100 epochs (not the frozen 200) and native-res transforms;
# both arms identical, so Delta stays valid. diag-only, never headline.
name: diagin100_r50_none
dataset: imagenet100
backbone: resnet50
epochs: 100
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 5
small_input: false
pretrained: false
subset_pct: 100
stem: none
stem_calibrate: true
