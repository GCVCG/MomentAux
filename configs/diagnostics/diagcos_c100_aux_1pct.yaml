# Cosine-head READOUT experiment: parent cell 'auxmag_1pct_sched0' verbatim
# + head: cosine (Gidaris-style, diag-only). Tests whether the left-flank
# readout penalty is head-EXPRESSIVITY (cosine helps) or label-INFORMATION
# (cosine changes nothing) -- Q7.3/probe evidence predicts the null.
name: diagcos_c100_aux_1pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 8
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
head: cosine
