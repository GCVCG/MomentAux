# ImageNet-100 @224px NATIVE ENVELOPE cell (5% of 126,689 images =
# 6,335 images, 63 per class over 100 classes).
#
# WHY THIS EXISTS: as for the imagenet64 envelope cells -- the 100% stage
# tested the scale falsifiers, not the envelope shape. Same 100-epoch budget
# and native-res pipeline as the 100% cells, identical across both arms.
# diag-only: NEVER mixed into frozen-recipe headline tables.
name: diagin100_vits_none_5pct
dataset: imagenet100
backbone: vit_small
optimizer: adamw
epochs: 100
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 5
small_input: false
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
augment: deit
