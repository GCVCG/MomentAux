# Cosine-head READOUT experiment: parent cell 'abl1_none' verbatim
# + head: cosine (Gidaris-style, diag-only). Tests whether the left-flank
# readout penalty is head-EXPRESSIVITY (cosine helps) or label-INFORMATION
# (cosine changes nothing) -- Q7.3/probe evidence predicts the null.
name: diagcos_c100_none_1pct
dataset: cifar100
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 8
small_input: true
pretrained: false
stem_kernel_size: 11
subset_pct: 1
backbone: resnet18
stem: none
head: cosine
