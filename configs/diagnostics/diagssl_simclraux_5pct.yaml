# COMBO: SimCLR init + champion MomentAux on top (2.02x compute). Does the
# moment prior add anything once SimCLR has shaped the features? The fwd-
# stem+aux combo was redundant; 'prior substitutes for supervision' also
# predicts redundancy here.
name: diagssl_simclraux_5pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 8
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
init_from: runs/simclr_pre_5pct/seed{seed}/pretrain.pt
