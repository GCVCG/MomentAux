# ViT-SSL envelope point @1%: completes the 1/5/10/25 comparison against
# the measured aux-ViT envelope (+1.35/+9.35/+13.26/+13.67).
# ViT-tiny from scratch @C100 1% -- first ATTENTION backbone (ConvNeXt was
# the first non-ResNet but is still convolutional). AdamW because ViTs do not
# train under the frozen SGD recipe; diag-only, never a headline row.
name: diagsslvit_simclr_1pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
init_from: runs/simclr_pre_vit_1pct/seed{seed}/pretrain.pt
