# Swin-T (hierarchical attention): the mechanism control -- is the ViT deficit attention-intrinsic or the absence of conv-like biases? AdamW => diag.
name: diaggrid_swin_tin_none_10pct
dataset: tin
backbone: swin_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
