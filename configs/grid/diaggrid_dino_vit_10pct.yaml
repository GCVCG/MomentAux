# DINO-init ViT (attention-native SSL, Caron 2021): the modern rebuttal to 'wrong SSL for ViTs'. diag (outside init).
name: diaggrid_dino_vit_10pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
init_from: runs/dino_pre_vit_10pct/seed{seed}/pretrain.pt
