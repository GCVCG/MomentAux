# DINO-init under DeiT augmentation -- does the substitution flip hold for self-distillation (deitssl was SimCLR-based)?
name: diaggrid_deitdino_10pct
dataset: cifar100
backbone: vit_tiny
optimizer: adamw
epochs: 200
batch_size: 128
lr: 0.001
weight_decay: 0.05
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
augment: deit
init_from: runs/dino_pre_vit_10pct/seed{seed}/pretrain.pt
