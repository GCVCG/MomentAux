# SimCLR-init on eurosat @100% -- SSL-vs-prior on a NON-PHOTO domain
# (2026-07-23, user: importance over cost). SimCLR's views encode PHOTO
# invariances (crop+color); eurosat tests whether contrastive pretraining
# transfers off natural photos while the moment prior's oriented-energy
# target is domain-agnostic. Baseline-config verbatim + init_from.
name: diaggrid_ssl_eurosat_100pct
dataset: eurosat
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 100
stem: none
stem_calibrate: true
init_from: runs/simclr_pre_eurosat_100pct/seed{seed}/pretrain.pt
