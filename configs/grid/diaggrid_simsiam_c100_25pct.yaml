# SimSiam-init (negative-free SSL, Chen&He 2021) -- answers 'SimCLR is a weak comparator'. diag (outside init).
name: diaggrid_simsiam_c100_25pct
dataset: cifar100
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 25
stem: none
stem_calibrate: true
init_from: runs/simsiam_pre_c100_25pct/seed{seed}/pretrain.pt
