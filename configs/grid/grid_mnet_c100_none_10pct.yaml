# MobileNetV3-small (edge CNN): the zero-inference-cost prior matters most on efficient models. Frozen SGD recipe.
name: grid_mnet_c100_none_10pct
dataset: cifar100
backbone: mobilenetv3_small_100
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 10
stem: none
stem_calibrate: true
