name: grid_mnet_tin_aux_1pct
dataset: tin
backbone: mobilenetv3_small_100
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 1
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: blocks.3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
