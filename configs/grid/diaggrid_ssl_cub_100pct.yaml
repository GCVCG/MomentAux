# SimCLR-init on CUB -- SSL famously struggles on fine-grained; the prior gave +2.74@100%.
name: diaggrid_ssl_cub_100pct
dataset: cub
backbone: resnet18
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 100
stem: none
stem_calibrate: true
init_from: runs/simclr_pre_cub_100pct/seed{seed}/pretrain.pt
