# Backbone-universality off C100 (one lambda0 for every ResNet was C100-only evidence).
name: grid_r34_pathmnist_aux_5pct
dataset: pathmnist
backbone: resnet34
epochs: 200
batch_size: 128
lr: 0.1
weight_decay: 0.0005
momentum: 0.9
num_workers: 2
small_input: true
pretrained: false
subset_pct: 5
stem: none
stem_calibrate: true
moment_aux:
  stem: energy-magnitude
  tap: layer3
  weight: 1.0
  weight_final: 0.0
  weight_schedule: cosine
  head_norm: true
